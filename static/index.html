<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CAT - Cyber Activity Tracker</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>CAT</h1>
        <p>Cyber Activity Tracker</p>
      </div>
      <div class="status-strip">
        <span id="healthStatus">대기</span>
      </div>
    </header>

    <main class="workspace">
      <section class="input-panel" aria-label="분석 입력">
        <form id="analysisForm">
          <div class="panel-title">
            <h2>분석 요청</h2>
            <button type="submit" id="analyzeButton">분석 실행</button>
          </div>

          <label class="file-drop" id="fileDrop">
            <input id="evtxFiles" name="files" type="file" multiple accept=".evtx,.xml" />
            <span>EVTX/XML 파일 선택</span>
            <strong id="fileSummary">선택된 파일 없음</strong>
          </label>

          <div class="form-grid">
            <label>
              <span>시작 시간</span>
              <input name="start_time" type="datetime-local" />
            </label>
            <label>
              <span>종료 시간</span>
              <input name="end_time" type="datetime-local" />
            </label>
            <label>
              <span>시간대</span>
              <input name="timezone" type="text" value="Asia/Seoul" />
            </label>
            <label>
              <span>최대 레코드</span>
              <input name="max_records" type="number" min="100" max="200000" step="100" value="20000" />
            </label>
          </div>

          <label class="toggle analysis-option">
            <input id="autoExpandTimeRange" name="auto_expand_time_range" type="checkbox" value="true" aria-describedby="autoExpandTimeRangeHelp" checked />
            <span>경계 증거가 있으면 업로드한 파일 안에서 분석 시간대를 자동 확장</span>
          </label>
          <p id="autoExpandTimeRangeHelp" class="field-note">선택한 시간 범위의 앞뒤에서 침해 흐름을 잇는 증거가 발견되면 CAT가 필요한 구간만 추가 분석합니다.</p>

          <div class="lm-row">
            <label>
              <span>에이전트</span>
              <select name="agent_backend" id="agentBackend">
                <option value="lmstudio" selected>LM Studio Qwen</option>
                <option value="rule">규칙 기반 보고서</option>
              </select>
            </label>
            <label>
              <span>LM Studio URL</span>
              <input name="lm_url" id="lmUrl" type="url" autocomplete="off" placeholder="http://192.168.100.1:1234" />
            </label>
            <label>
              <span>모델</span>
              <input name="lm_model" id="lmModel" type="text" autocomplete="off" />
            </label>
          </div>
        </form>
      </section>

      <section class="result-panel" aria-label="분석 결과">
        <div class="tabs">
          <div class="tab-list" role="tablist" aria-label="분석 결과 보기">
            <button id="reportTab" class="tab active" data-tab="report" type="button" role="tab" aria-controls="reportView" aria-selected="true" tabindex="0">
              보고서
            </button>
            <button id="findingsTab" class="tab" data-tab="findings" type="button" role="tab" aria-controls="findingsView" aria-selected="false" tabindex="-1">
              탐지 결과
            </button>
            <button id="summaryTab" class="tab" data-tab="summary" type="button" role="tab" aria-controls="summaryView" aria-selected="false" tabindex="-1">
              요약
            </button>
          </div>
          <div class="result-actions">
            <button
              id="historyButton"
              class="secondary"
              type="button"
              aria-haspopup="dialog"
              aria-controls="historyDialog"
            >분석 이력</button>
            <button
              id="savePdfButton"
              class="secondary"
              type="button"
              title="보고서·요약·침해행위·증거 한계를 함께 PDF로 저장합니다."
              disabled
            >PDF로 저장</button>
          </div>
        </div>

        <div id="loading" class="loading hidden">
          <div class="progress-track">
            <div id="progressFill" class="progress-fill"></div>
            <img id="progressCat" class="progress-cat" src="/asset/nyan_cat.gif" alt="" />
          </div>
          <span id="loadingText">분석 준비 중</span>
        </div>

        <div id="errorBox" class="error-box hidden"></div>

        <article
          id="reportView"
          class="tab-view markdown-view"
          role="tabpanel"
          aria-labelledby="reportTab"
          tabindex="0"
        >
          <div class="empty-state">
            <div
              id="catSelector"
              class="cat-selector"
              role="region"
              aria-roledescription="캐러셀"
              aria-label="메인 고양이 사진 선택"
            >
              <img
                id="mainCatImage"
                src="/asset/cat.jpg"
                alt="선글라스를 쓴 회색 고양이"
                draggable="false"
              />
              <button
                id="previousCatButton"
                class="cat-selector-button previous"
                type="button"
                aria-label="이전 고양이 사진"
                aria-controls="mainCatImage"
              >
                <span aria-hidden="true">&#10094;</span>
              </button>
              <button
                id="nextCatButton"
                class="cat-selector-button next"
                type="button"
                aria-label="다음 고양이 사진"
                aria-controls="mainCatImage"
              >
                <span aria-hidden="true">&#10095;</span>
              </button>
            </div>
          </div>
        </article>
        <article id="findingsView" class="tab-view hidden" role="tabpanel" aria-labelledby="findingsTab" tabindex="0"></article>
        <article id="summaryView" class="tab-view hidden" role="tabpanel" aria-labelledby="summaryTab" tabindex="0"></article>
      </section>
    </main>

    <dialog id="historyDialog" class="history-dialog" aria-labelledby="historyTitle" aria-describedby="historyDescription">
      <div class="history-dialog-header">
        <div>
          <h2 id="historyTitle">분석 이력</h2>
          <p id="historyDescription">이 브라우저에 저장된 요약본입니다. 업로드한 원본 파일과 API 키는 저장하지 않습니다.</p>
        </div>
        <button id="closeHistoryButton" type="button" aria-label="분석 이력 닫기">닫기</button>
      </div>
      <div class="history-toolbar">
        <span id="historyStorageStatus" aria-live="polite"></span>
        <button id="clearHistoryButton" type="button">전체 삭제</button>
      </div>
      <div id="historyList" class="history-list" role="list"></div>
    </dialog>

    <script src="/static/app.js" type="module"></script>
  </body>
</html>
